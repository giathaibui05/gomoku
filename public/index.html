<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d1117">
    <title>Gomoku Online ⚔️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="lib/fa/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/myChatBox.css">

    <script src="lib/p5.min.js"></script>
    <script src="lib/jquery-3.4.1.min.js"></script>
    <script src="lib/sweetalert2.all.min.js"></script>
    <script src="socket.io/socket.io.js"></script>
    <script src="js/myChatBox.js"></script>
    <script src="js/setup_socket.js"></script>
    <script src="js/caro.js"></script>
    <script src="js/main.js"></script>
</head>
<body>

<!-- ===== AUTH OVERLAY ===== -->
<div id="authOverlay">
    <div class="auth-box">
        <div class="auth-logo">
            <span class="auth-logo-icon">⚔️</span>
            <h1>GOMOKU <span>ONLINE</span></h1>
        </div>

        <div class="auth-tabs">
            <button class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">
                <i class="fas fa-sign-in-alt"></i> Đăng nhập
            </button>
            <button class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">
                <i class="fas fa-user-plus"></i> Đăng ký
            </button>
        </div>

        <!-- Login form -->
        <div class="auth-form-panel active" id="panelLogin">
            <div class="auth-field">
                <label>Tên đăng nhập</label>
                <input type="text" id="loginUsername" placeholder="Nhập tên đăng nhập..." autocomplete="username" maxlength="20">
            </div>
            <div class="auth-field">
                <label>Mật khẩu</label>
                <input type="password" id="loginPassword" placeholder="Nhập mật khẩu..." autocomplete="current-password">
            </div>
            <div class="auth-err" id="loginErr"></div>
            <button class="auth-btn" id="btnLogin">
                <i class="fas fa-sign-in-alt"></i> Đăng nhập
            </button>
        </div>

        <!-- Register form -->
        <div class="auth-form-panel" id="panelRegister">
            <div class="auth-field">
                <label>Tên đăng nhập</label>
                <input type="text" id="regUsername" placeholder="Tối thiểu 3 ký tự..." autocomplete="username" maxlength="20">
            </div>
            <div class="auth-field">
                <label>Mật khẩu</label>
                <input type="password" id="regPassword" placeholder="Tối thiểu 4 ký tự..." autocomplete="new-password">
            </div>
            <div class="auth-err" id="regErr"></div>
            <button class="auth-btn" id="btnRegister">
                <i class="fas fa-user-plus"></i> Đăng ký & Vào game
            </button>
        </div>
    </div>
</div>

<!-- ===== LOBBY ===== -->
<div class="before-game" style="display:none">
    <div class="lobby-header">
        <div class="logo-area">
            <div class="logo-icon">⚔️</div>
            <h1 class="logo-text">GOMOKU <span class="logo-sub">ONLINE</span></h1>
        </div>
        <div class="header-meta">
            <div class="online-badge" id="online_count_container" title="Số người đang online">
                <i class="fas fa-circle pulse-dot"></i>
                <span id="online_count">0</span>
                <span class="online-label">online</span>
            </div>
            <div class="player-badge">
                <i class="fas fa-user-ninja"></i>
                <span id="player_name">—</span>
            </div>
            <button class="btn-logout" id="btnLogout">
                <i class="fas fa-sign-out-alt"></i> Đăng xuất
            </button>
        </div>
    </div>

    <div class="lobby-body">
        <div class="lobby-controls">
            <button class="btn-primary-game" id="btnTaoPhong">
                <i class="fas fa-plus-circle"></i> Tạo phòng
            </button>
            <button class="btn-primary-game btn-random-room" id="btnRandomRoom">
                <i class="fas fa-random"></i> Vào ngẫu nhiên
            </button>
            <div class="search-wrapper">
                <i class="fas fa-search search-icon"></i>
                <input class="search-input" id="inpSearch" type="text" placeholder="Tìm phòng, chủ phòng...">
            </div>
        </div>

        <div class="rooms-container">
            <div class="rooms-header">
                <span><i class="fas fa-door-open"></i> Danh sách phòng</span>
                <span class="rooms-count" id="roomsCount">0 phòng</span>
            </div>
            <table id="tbRooms">
                <thead>
                    <tr>
                        <th><i class="fas fa-hand-peace"></i> Phòng</th>
                        <th><i class="fas fa-user-circle"></i> Chủ</th>
                        <th><i class="fas fa-comment-alt"></i> Thông điệp</th>
                        <th><i class="fas fa-users"></i> Người</th>
                        <th><i class="fas fa-cog"></i></th>
                    </tr>
                </thead>
                <tbody id="tbRoomsBody">
                    <tr class="empty-row">
                        <td colspan="5">
                            <div class="empty-state">
                                <i class="fas fa-ghost"></i>
                                <p>Chưa có phòng nào. Hãy tạo phòng đầu tiên!</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="lobby-footer">
        <span>Gomoku Online — 5 quân thắng ♟️</span>
    </div>
</div>

<!-- ===== GAME ===== -->
<div class="game">
    <!-- Timer bar (injected by JS but also reserved space here) -->
    <div class="game-topbar">
        <div class="game-room-info">
            <i class="fas fa-chess-board"></i>
            <span id="currentRoomName">Phòng</span>
        </div>
        <div class="turn-display">
            Lượt: <span id="turnName" class="turn-name">—</span>
        </div>
        <div class="game-controls">
            <button class="ctrl-btn" id="btnFocusPreMove" title="Tới quân vừa đánh">
                <i class="fas fa-bullseye"></i>
            </button>
            <button class="ctrl-btn" id="btnUndoGame" title="Xin đánh lại">
                <i class="fas fa-undo-alt"></i>
            </button>
            <button class="ctrl-btn" id="btnNewGame" title="Ván mới">
                <i class="fas fa-rotate-left"></i>
            </button>
            <button class="ctrl-btn" id="btnSwitchTheme" title="Đổi giao diện">
                <i class="fas fa-palette"></i>
            </button>
            <button class="ctrl-btn ctrl-btn--surrender" id="btnSurrender" title="Đầu hàng">
                <i class="fas fa-flag"></i>
            </button>
            <button class="ctrl-btn ctrl-btn--danger" id="btnLeaveRoom" title="Rời phòng">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </div>
    <!-- Timer bar: shown below topbar when game starts -->
    <div id="timerBar" style="display:none"></div>
    <div id="cnv"></div>
</div>

<!-- ===== CHAT BOX ===== -->
<button class="chat-toggle-btn" id="btn-open-chat" title="Mở chat">
    <i class="fas fa-comments"></i>
    <span class="unread-badge" id="unread-count" style="display:none">0</span>
</button>

<div class="chat-container" id="chatContainer">
    <div class="chat-header">
        <div class="chat-tabs" id="btns-choose-conv">
            <button class="chat-tab active" data-conv="conv-world">
                <i class="fas fa-globe-americas"></i> Thế giới
                <span class="tab-badge" id="badge-world" style="display:none">0</span>
            </button>
            <button class="chat-tab" data-conv="conv-room">
                <i class="fas fa-door-open"></i> Phòng
                <span class="tab-badge" id="badge-room" style="display:none">0</span>
            </button>
        </div>
        <button class="chat-close-btn" id="btn-close-chat" title="Đóng chat">
            <i class="fas fa-chevron-down"></i>
        </button>
    </div>
    <div class="conversation-container">
        <div class="conversation active" id="conv-world"></div>
        <div class="conversation" id="conv-room"></div>
    </div>
    <div class="chat-footer">
        <div class="chat-input-row">
            <input class="chat-input" id="input-message" placeholder="Nhập tin nhắn... (Enter để gửi)">
            <button class="emoji-btn" id="btn-emoji-picker" title="Emoji">
                <i class="fas fa-face-smile"></i>
            </button>
            <button class="send-btn" id="btn-send-message" title="Gửi">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
        <div class="composer-popover" id="emoji-picker">
            <div class="emoji-picker-container">
                <div class="composer-popover-header">
                    <input class="emoji-input-search" placeholder="🔍 Tìm emoji...">
                </div>
                <div class="composer-popover-body-container noselect">
                    <div class="composer-popover-body">
                        <div class="emoji-picker-groups">
                            <div class="emoji-picker-group" id="frequently-used"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="composer-popover-caret"></div>
        </div>
    </div>
</div>

</body>
</html>
